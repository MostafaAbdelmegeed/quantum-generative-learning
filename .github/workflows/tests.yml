name: Numerical checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.12"
      - run: uv sync --locked --extra dev --python 3.11.15
      - run: uvx ruff@0.17.2 check src tests examples scripts
      - run: uvx ruff@0.17.2 format --check src tests examples scripts
      - run: uv run --locked --extra dev python -m pytest
      - run: uv run --locked qgen audit --output results/iqp-mc-v1
      - run: uv run --locked qgen audit --output results/connectivity-v1
      - run: uv run --locked python -m qgen.generalization_audit --output results/observable-generalization-v1
      - run: uv run --locked python -m qgen.diagnostics audit --output results/observable-diagnostics-v1
      - run: uv run --locked python -m qgen.routing_controls audit --output results/routing-controls-v1 --replay
